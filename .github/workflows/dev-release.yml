name: Dev Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      TAG: dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download CI packages
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          # 四个产物全要：两服 × 两平台。缺任何一个就不发 dev，避免出现半套产物。
          for NAME in \
            WuwaTappo-Full-CN-Community-macOS-arm64 \
            WuwaTappo-Full-Global-Community-macOS-arm64 \
            WuwaTappo-Full-CN-Community-Windows-x64 \
            WuwaTappo-Full-Global-Community-Windows-x64; do
            gh run download "$RUN_ID" --repo "$GH_REPO" --name "$NAME" --dir dist
          done
          ls -la dist
      - name: Point dev tag at CI commit
        run: git push --force origin "$HEAD_SHA:refs/tags/$TAG"
      - name: Create or update rolling dev release
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          CN=$(node -p "require('./macos/upstream-cn.json').version")
          GLOBAL=$(node -p "require('./macos/upstream-global.json').version")
          OFFICIAL_WIN=$(node -p "require('./windows/upstream-win.json').client_version")
          SHORT_SHA="${HEAD_SHA:0:12}"
          cat > /tmp/dev-release-notes.md <<EOF
          # WuwaTappo 社区版 Dev

          自动构建版本：${VERSION}
          官方基底：国服 ${CN} / 国际服 ${GLOBAL}
          Windows 适配基底：${OFFICIAL_WIN}
          源码提交：${HEAD_SHA}

          这是随 dev 分支持续更新的开发预发布版本，仅用于测试。
          macOS 产物为 dmg（拖入「应用程序」）；Windows 产物为 exe 安装包（装完双击快捷方式即用，不含 WebView2 运行时）。
          EOF
          FILES=(dist/*.dmg dist/*.exe)
          for FILE in "${FILES[@]}"; do [[ -f "$FILE" ]] || { echo "缺少产物：$FILE" >&2; exit 1; }; done
          if compgen -G 'dist/*.sha256' > /dev/null; then
            FILES+=(dist/*.sha256)
          fi
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --repo "$GH_REPO" --clobber
            gh release edit "$TAG" --repo "$GH_REPO" \
              --title "WuwaTappo 社区版 Dev (${SHORT_SHA})" \
              --notes-file /tmp/dev-release-notes.md \
              --prerelease --latest=false
          else
            gh release create "$TAG" "${FILES[@]}" --repo "$GH_REPO" \
              --target "$HEAD_SHA" \
              --title "WuwaTappo 社区版 Dev (${SHORT_SHA})" \
              --notes-file /tmp/dev-release-notes.md \
              --prerelease --latest=false
          fi
