name: Sync official upstream

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      region:
        description: '要检查的服务区域'
        required: true
        default: both
        type: choice
        options: [both, cn, global]

permissions:
  contents: read

concurrency:
  group: sync-official-upstream
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.regions.outputs.matrix }}
    steps:
      - name: Select regions to check
        id: regions
        env:
          TARGET: ${{ inputs.region || 'both' }}
        run: |
          case "$TARGET" in
            cn) echo 'matrix={"include":[{"region":"cn","label":"国服"}]}' >> "$GITHUB_OUTPUT" ;;
            global) echo 'matrix={"include":[{"region":"global","label":"国际服"}]}' >> "$GITHUB_OUTPUT" ;;
            both) echo 'matrix={"include":[{"region":"cn","label":"国服"},{"region":"global","label":"国际服"}]}' >> "$GITHUB_OUTPUT" ;;
            *) echo "未知服务区域：$TARGET" >&2; exit 2 ;;
          esac

  sync:
    name: ${{ matrix.region }}
    needs: plan
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      WUWA_REGION: ${{ matrix.region }}
      REGION_LABEL: ${{ matrix.label }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Check official regional version
        id: upstream
        run: |
          mkdir -p macos/.work
          node macos/scripts/sync-upstream.mjs --check > macos/.work/upstream-check.json
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { getRegionProfile } from './macos/scripts/regions.mjs';
          const profile = getRegionProfile();
          const result = JSON.parse(readFileSync('macos/.work/upstream-check.json', 'utf8'));
          if (typeof result.changed !== 'boolean' || !/^\d+\.\d+\.\d+$/.test(result.latestVersion)) throw new Error('Invalid official version response');
          const title = `同步${profile.label}官方资源 ${result.latestVersion}`;
          const open = JSON.parse(execFileSync('gh', ['pr', 'list', '--state', 'open', '--search', `${title} in:title`, '--limit', '100', '--json', 'title'], { encoding: 'utf8' }));
          const pending = open.some(pr => pr.title === title);
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${result.changed && !pending}\nversion=${result.latestVersion}\nlock=${profile.upstreamLock}\n`);
          NODE
      - name: Install build tools
        if: steps.upstream.outputs.changed == 'true'
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          brew install sevenzip
      - uses: actions/cache/restore@v4
        id: cargo-cache
        if: steps.upstream.outputs.changed == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            macos/src-tauri/target
          key: macos-arm64-${{ matrix.region }}-rust-1.97.1-${{ hashFiles('macos/src-tauri/Cargo.lock') }}
      - name: Extract updated official resources
        id: extract
        if: steps.upstream.outputs.changed == 'true'
        run: |
          npm ci
          set -o pipefail
          node macos/scripts/sync-upstream.mjs --update-lock 2>&1 | tee macos/.work/upstream-extract.log
      - name: Read verified candidate installer cache identity
        id: installer
        if: steps.extract.outcome == 'success'
        run: node macos/scripts/installer-cache.mjs
      - name: Save verified candidate official installer
        if: steps.extract.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.installer.outputs.path }}
          key: ${{ steps.installer.outputs.key }}
      - name: Record candidate contract changes without accepting them
        id: inventory
        if: steps.extract.outcome == 'success'
        run: |
          set -o pipefail
          node macos/scripts/upstream-review.mjs inventory 2>&1 | tee macos/.work/upstream-inventory.log
      - name: Validate frontend compatibility
        id: frontend
        if: steps.extract.outcome == 'success'
        run: |
          set -o pipefail
          { npm run icons && npm run prepare:frontend && npm test && npm run test:fullatlas; } 2>&1 | tee macos/.work/upstream-frontend.log
      - name: Test native backend
        id: native-tests
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -o pipefail
          npm run test:rust 2>&1 | tee macos/.work/upstream-native.log
      - name: Build native application
        id: build
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -o pipefail
          npm run build -- -- --locked 2>&1 | tee macos/.work/upstream-build.log
      - name: Package candidate
        id: validate
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -o pipefail
          npm run package 2>&1 | tee macos/.work/package-macos.log
      - name: Keep validated packages for review
        if: steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: official-${{ matrix.region }}-candidate
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Save compiled Cargo dependencies
        if: always() && steps.native-tests.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            macos/src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Keep upstream review evidence
        if: always() && steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: official-${{ matrix.region }}-review
          path: |
            macos/.work/upstream-check.json
            macos/.work/upstream-*.log
            macos/.work/upstream-review/*.json
            macos/.work/package-macos.log
            macos/upstream-${{ matrix.region }}.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - name: Publish verified official installer as an immutable build input
        id: mirror
        if: always() && !cancelled() && steps.extract.outcome == 'success'
        run: node macos/scripts/installer-mirror.mjs
      - name: Open validated update or draft requiring adaptation
        if: always() && !cancelled() && steps.extract.outcome == 'success'
        env:
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          NATIVE_OUTCOME: ${{ steps.native-tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PACKAGE_OUTCOME: ${{ steps.validate.outcome }}
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
        run: node macos/scripts/upstream-review.mjs open-pr
      - name: Report incompatible or unavailable upstream
        if: failure()
        run: node macos/scripts/upstream-review.mjs report
