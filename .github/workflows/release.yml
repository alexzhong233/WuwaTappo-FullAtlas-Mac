name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing integration version tag, for example v1.2.2-alpha.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: WuwaTappo-*
          merge-multiple: true
          path: dist
      - name: Create draft Full Community release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]]
          for EXT in zip dmg; do
            PACKAGES=(dist/WuwaTappo-Full-Community-*-arm64."$EXT")
            [[ ${#PACKAGES[@]} -eq 1 && -f "${PACKAGES[0]}" ]]
          done
          # Windows 产物为可选：历史 tag 或 Windows 构建失败时仍能发 Mac 版
          if compgen -G 'dist/*Windows-x64*.zip' > /dev/null; then
            echo "包含 Windows 产物："
            ls -la dist/*Windows-x64*
          else
            echo "::warning::没有 Windows 产物，本次发布仅含 macOS"
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const official = JSON.parse(readFileSync('upstream-cn.json', 'utf8')).version;
          if (process.env.TAG !== `v${version}`) throw new Error('Tag does not match integration version');
          for (const ext of ['zip', 'dmg']) {
            if (!existsSync(`dist/WuwaTappo-Full-Community-${version}-arm64.${ext}`)) {
              throw new Error('Release artifact version does not match source');
            }
          }
          const notes = `docs/RELEASE_NOTES_${version}.md`;
          const body = existsSync(notes)
            ? readFileSync(notes, 'utf8')
            : `# WuwaTappo Full Community ${version}\n\n官方国服基底 ${official}，Apple Silicon / macOS 13 及以上。实验预发布，完整业务仍需验收。\n`;
          writeFileSync('/tmp/release-notes.md', `${body}\n\n官方资源版本：${official}。此 Release 保持草稿，待维护者验收后手动发布。\n`);
          NODE
          # 收集产物：mac 的 zip/dmg 必须存在，Windows zip 与校验和按需追加
          FILES=(dist/*.zip dist/*.dmg)
          if compgen -G 'dist/*.sha256' > /dev/null; then
            FILES+=(dist/*.sha256)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --verify-tag --title "WuwaTappo Full Community $TAG" --notes-file /tmp/release-notes.md --draft --prerelease
          fi
