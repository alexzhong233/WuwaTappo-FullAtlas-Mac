name: Dev Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      TAG: dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download CI packages
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$GH_REPO" --name WuwaTappo-Full-Community-arm64 --dir dist
          MAC=(dist/WuwaTappo-Full-Community-*-arm64.zip dist/WuwaTappo-Full-Community-*-arm64.dmg)
          [[ ${#MAC[@]} -eq 2 && -f "${MAC[0]}" && -f "${MAC[1]}" ]]
          if gh run download "$RUN_ID" --repo "$GH_REPO" --name WuwaTappo-Full-Community-Windows-x64 --dir dist; then
            ls -la dist/*Windows-x64*
          else
            echo "::warning::Windows 产物缺失，本次 dev 发布仅含 macOS"
          fi
      - name: Point dev tag at CI commit
        run: git push --force origin "$HEAD_SHA:refs/tags/$TAG"
      - name: Create or update rolling dev release
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          OFFICIAL=$(node -p "require('./upstream-cn.json').version")
          OFFICIAL_WIN=$(node -p "require('./windows/upstream-win.json').client_version")
          SHORT_SHA="${HEAD_SHA:0:12}"
          cat > /tmp/dev-release-notes.md <<EOF
          # WuwaTappo Full Community Dev

          自动构建版本：${VERSION}
          官方国服资源：${OFFICIAL}
          Windows 适配基底：${OFFICIAL_WIN}
          源码提交：${HEAD_SHA}

          这是随 dev 分支持续更新的开发预发布版本，仅用于测试。
          macOS 产物为 dmg/zip；Windows 产物为免安装 zip（不含 WebView2 运行时）。
          EOF
          FILES=(dist/*.zip dist/*.dmg)
          if compgen -G 'dist/*.sha256' > /dev/null; then
            FILES+=(dist/*.sha256)
          fi
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --repo "$GH_REPO" --clobber
            gh release edit "$TAG" --repo "$GH_REPO" \
              --title "WuwaTappo Full Community Dev (${SHORT_SHA})" \
              --notes-file /tmp/dev-release-notes.md \
              --prerelease --latest=false
          else
            gh release create "$TAG" "${FILES[@]}" --repo "$GH_REPO" \
              --target "$HEAD_SHA" \
              --title "WuwaTappo Full Community Dev (${SHORT_SHA})" \
              --notes-file /tmp/dev-release-notes.md \
              --prerelease --latest=false
          fi
