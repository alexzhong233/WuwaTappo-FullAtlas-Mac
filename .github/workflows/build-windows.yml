name: Build Windows

on:
  workflow_call:
    inputs:
      ref:
        description: Git revision to build
        required: false
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: windows-x64-${{ matrix.region }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: cn
            artifact: WuwaTappo-Full-CN-Community-Windows-x64
          - region: global
            artifact: WuwaTappo-Full-Global-Community-Windows-x64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13'

      - name: Read pinned official client identity
        id: pinned
        shell: pwsh
        run: |
          $lockFile = if ('${{ matrix.region }}' -eq 'global') { 'windows/upstream-win-global.json' } else { 'windows/upstream-win.json' }
          $lock = Get-Content $lockFile -Raw | ConvertFrom-Json
          "version=$($lock.client_version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $bytes = [Text.Encoding]::UTF8.GetBytes([string]$lock.installer_url)
          $sha = [Security.Cryptography.SHA256]::Create().ComputeHash($bytes)
          $hex = -join ($sha | ForEach-Object { $_.ToString('x2') })
          "urlhash=$($hex.Substring(0,16))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore pinned official installer
        id: installer-cache
        uses: actions/cache/restore@v4
        with:
          # 只缓存安装包与解出的主程序；解包产物 app\ 不进缓存，避免几百 MB 冗余
          # 两个区域各有一套基底目录：build（国服）/ build-global（国际服）
          path: |
            windows/build${{ matrix.region == 'global' && '-global' || '' }}/official/*/*setup.exe
            windows/build${{ matrix.region == 'global' && '-global' || '' }}/official/*/base/WuwaTappo.official.exe
          key: windows-official-${{ matrix.region }}-${{ steps.pinned.outputs.version }}-${{ steps.pinned.outputs.urlhash }}

      - name: Install NSIS
        # 发行物是安装包 exe（双击快捷方式即用），不是绿色 zip
        shell: pwsh
        run: |
          function Find-Makensis {
            $list = @()
            $programFilesX86 = ${env:ProgramFiles(x86)}
            if ($programFilesX86) { $list += (Join-Path $programFilesX86 'NSIS\makensis.exe') }
            if ($env:ProgramFiles) { $list += (Join-Path $env:ProgramFiles 'NSIS\makensis.exe') }
            foreach ($item in $list) { if (Test-Path -LiteralPath $item) { return $item } }
            return $null
          }
          $makensis = Find-Makensis
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = Find-Makensis
          }
          if (-not $makensis) { throw 'NSIS 装不上，无法产出 exe 安装包' }
          Write-Host "makensis=$makensis"

      - name: Build, patch and package
        shell: pwsh
        env:
          # 显式指定解释器。--no-runtime 不把 870MB 的 WebView2 私有运行时塞进产物，
          # 改由入口 stub 回退到 runner / 用户机器上的系统运行时（与官方客户端一致），
          # 产物体积从 ~700MB 降到 ~130MB。
          WUWA_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          node scripts/build-platform.mjs --platform=win --package --no-runtime --region=${{ matrix.region }}

      - name: Verify WebView2 fallback
        shell: pwsh
        # 发布包不带 runtime\，所以 stub 必须能回退系统运行时。
        # 这条断言挡的是「stub 又把 WEBVIEW2_BROWSER_EXECUTABLE_FOLDER 钉死到空目录」的回归——
        # 那会让装完的包双击就报 "找不到 WebView2"，而 runner 上没法开窗口验证。
        run: |
          $dir = if ('${{ matrix.region }}' -eq 'global') { 'windows/build-global' } else { 'windows/build' }
          $report = Join-Path $dir 'build_report_v2.json'
          if (-not (Test-Path -LiteralPath $report)) { throw "缺少构建报告：$report" }
          $stub = (Get-Content -LiteralPath $report -Raw | ConvertFrom-Json).private_webview_entry_stub
          if (-not $stub) { throw '构建报告里没有入口 stub 记录' }
          if ($stub.runtime_fallback -ne $true) {
            throw '入口 stub 仍无条件钉死 WEBVIEW2_BROWSER_EXECUTABLE_FOLDER：--no-runtime 产物会启动失败'
          }
          Write-Host "入口 stub 支持回退系统运行时 (rva=$($stub.rva), size=$($stub.size))"
          $payload = if ('${{ matrix.region }}' -eq 'global') { 'windows/build-global/payload' } else { 'windows/build/payload' }
          if (Test-Path -LiteralPath (Join-Path $payload 'runtime')) {
            throw "payload 里出现了 runtime\，--no-runtime 构建不该带私有运行时"
          }

      - name: Save pinned official installer
        if: steps.installer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: windows/build${{ matrix.region == 'global' && '-global' || '' }}/official
          key: windows-official-${{ matrix.region }}-${{ steps.pinned.outputs.version }}-${{ steps.pinned.outputs.urlhash }}

      - name: Report artifact
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter '${{ matrix.artifact }}-*' -ErrorAction SilentlyContinue |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*Windows-x64*.exe
            dist/*Windows-x64*.exe.sha256
          if-no-files-found: error
          retention-days: 14
