name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing integration version tag, for example v1.2.2-alpha.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 两个平台都必须构建成功才允许发版：Windows 只出 exe 安装包，macOS 只出 dmg。
  # 任何一个挂了，publish 直接不启动，不会出现"只发了一半平台"的 Release。
  build-macos:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
  build-windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: WuwaTappo-*
          merge-multiple: true
          path: dist
      - name: Create draft release with both platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]]
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const cn = JSON.parse(readFileSync('macos/upstream-cn.json', 'utf8')).version;
          const global = JSON.parse(readFileSync('macos/upstream-global.json', 'utf8')).version;
          if (process.env.TAG !== `v${version}`) throw new Error('Tag does not match integration version');
          // 四个产物缺一不可：两服 × 两平台，格式各自唯一（mac=dmg / win=exe）。
          const expected = [
            `WuwaTappo-Full-CN-Community-${version}-macOS-arm64.dmg`,
            `WuwaTappo-Full-Global-Community-${version}-macOS-arm64.dmg`,
            `WuwaTappo-Full-CN-Community-Windows-x64-${version}.exe`,
            `WuwaTappo-Full-Global-Community-Windows-x64-${version}.exe`,
          ];
          const missing = expected.filter(name => !existsSync(`dist/${name}`));
          if (missing.length) throw new Error(`Release 缺少产物，两个平台都必须构建成功：${missing.join(', ')}`);
          const notes = `macos/docs/RELEASE_NOTES_${version}.md`;
          const body = existsSync(notes)
            ? readFileSync(notes, 'utf8')
            : `# WuwaTappo Full Community ${version}\n\n社区版整合了官方客户端的本地图鉴与桌宠能力，国服与国际服分开打包。\n\n- macOS：Apple Silicon / macOS 13 及以上，下载 \`.dmg\` 拖入「应用程序」\n- Windows：下载 \`.exe\` 安装后双击快捷方式即可使用\n\n实验预发布，完整业务仍需验收。\n`;
          writeFileSync('/tmp/release-notes.md', `${body}\n\n官方基底：国服 ${cn} / 国际服 ${global}。此 Release 保持草稿，待维护者验收后手动发布。\n`);
          writeFileSync('/tmp/assets.txt', expected.map(name => `dist/${name}`).join('\n') + '\n');
          NODE
          mapfile -t FILES < /tmp/assets.txt
          for FILE in "${FILES[@]}"; do ls -la "$FILE"; done
          if compgen -G 'dist/*.sha256' > /dev/null; then
            FILES+=(dist/*.sha256)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --verify-tag --title "WuwaTappo Full Community $TAG" --notes-file /tmp/release-notes.md --draft --prerelease
          fi
