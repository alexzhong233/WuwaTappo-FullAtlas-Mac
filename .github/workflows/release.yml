name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing integration version tag, for example v1.2.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WuwaTappo-*-Mac-arm64
          merge-multiple: true
          path: dist
      - name: Create draft FullAtlas Mac release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for EXT in zip dmg; do
            PACKAGES=(dist/WuwaTappo-FullAtlas-Mac-*-arm64."$EXT")
            [[ ${#PACKAGES[@]} -eq 1 && -f "${PACKAGES[0]}" ]]
          done
          cat > /tmp/release-notes.md <<'NOTES'
          ## WuwaTappo FullAtlas Mac · 国服预览构建

          Apple Silicon，macOS 13 及以上。使用官方 1.0.2 前端及 FullAtlas v1.2 适配代码。官方 1.0.3 仍需适配审核。

          图鉴数据可刷新，图像仍依赖官方 CDN。关闭本地图鉴后可使用官方联机；点击和奖励继续由真实账号服务处理。

          本构建使用本机临时签名，未经 Apple 公证。下载 DMG 后将应用拖入“应用程序”。源码自动化验证完成后，仍需人工验收首次登录、输入监控授权、图鉴切换及联机。

          此 Release 保持草稿，待验收后由维护者发布。应用不支持安装 Windows 更新包。
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.dmg --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.dmg --verify-tag --title "WuwaTappo FullAtlas Mac $TAG" --notes-file /tmp/release-notes.md --draft --prerelease
          fi
